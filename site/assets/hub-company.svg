<g data-id="title" class="er-label"><text x="32" y="52" font-size="20" font-weight="700" fill="#1f2328">Company conceptual model</text></g>
<g data-id="note:0" class="er-label"><text x="32" y="1136" font-size="13" fill="#57606a">ManagerStartDate belongs to the department&#39;s current management assignment; exactly one manager makes it a single-valued department attribute.</text></g>
<g data-id="note:1" class="er-label"><text x="32" y="1156" font-size="13" fill="#57606a">WORKS_FOR records employee membership; MANAGES records management responsibility. Both relationships are required and do not duplicate a fact.</text></g>
<g data-id="note:2" class="er-label"><text x="32" y="1176" font-size="13" fill="#57606a">The model covers one company; Company is the scope, not a separately identified entity.</text></g>
<g data-id="note:3" class="er-label"><text x="32" y="1196" font-size="13" fill="#57606a">Each department has several distinct locations (at least two); version 1 multivalued attributes cannot encode a minimum count.</text></g>
<g data-id="note:4" class="er-label"><text x="32" y="1216" font-size="13" fill="#57606a">A dependent&#39;s first name is assumed unique within its employee&#39;s dependents; its full identifier is employee SSN plus FirstName.</text></g>
<g data-id="note:5" class="er-label"><text x="32" y="1236" font-size="13" fill="#57606a">No upper bound on departments managed by an employee was specified, so MANAGES uses employee participation 0..N.</text></g>
<g data-id="note:6" class="er-label"><text x="32" y="1256" font-size="13" fill="#57606a">Managers need not work for the department they manage; no such constraint was specified.</text></g>
<g data-id="note:7" class="er-label"><text x="32" y="1276" font-size="13" fill="#57606a">A direct supervisor is another employee, excluding self-supervision; this inequality is a domain constraint not encoded by cardinality.</text></g>
</svg>
