<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>chen-er notebook</title></head>
<body>
  <header class="header">
    <h1 id="title">chen-er</h1><span id="path" class="path"></span>
    <label class="engine">Engine <select id="engine"><option>simple</option><option>layered</option><option>stress</option></select></label>
    <span id="quality" class="quality">Quality pending</span>
    <span id="status" role="status" aria-live="polite">connecting</span>
    <button id="undo" disabled title="Undo (⌘/Ctrl+Z)">Undo</button><button id="redo" disabled title="Redo (⌘/Ctrl+Shift+Z)">Redo</button>
    <button id="fit" title="Fit (F)">Fit</button>
    <details class="actions"><summary>Export</summary><div class="menu">
      <a href="/api/export.svg" download>Export SVG</a><a href="/api/export.png?scale=2" download>Export PNG</a>
      <button id="relayout-mobile" class="mobile-only">Re-layout</button><button id="reset-mobile" class="mobile-only">Reset pins</button><button id="theme">Dark desk</button>
    </div></details><button id="relayout" class="desktop-only" title="Lay the whole diagram out again; pins are kept">Re-layout</button><button id="reset" class="desktop-only">Reset pins</button>
  </header>
  <main class="workspace">
    <section id="canvas" class="canvas" tabindex="0" aria-label="Diagram. F fits, plus and minus zoom, 0 resets zoom. Arrow keys pan. Select a node and use arrow keys to move it; Alt disables snap. Delete unpins.">
      <div id="sheet" class="sheet"><div id="figure" class="figure"></div><svg id="overlay" class="overlay" xmlns="http://www.w3.org/2000/svg" aria-label="Findings and pin marks"></svg></div>
      <div id="node-actions" class="node-actions" hidden aria-label="Selected node actions">
        <div id="node-toolbar" class="node-toolbar" role="toolbar" aria-label="Node actions">
          <span id="node-name"></span>
          <button id="node-focus" class="node-icon" aria-label="Focus" title="Focus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5.25 5.25"/></svg>
          </button>
          <button id="add-attribute" class="node-icon" aria-label="Add attribute" title="Add attribute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="6.75"/><path d="M12 8.5v7M8.5 12h7"/></svg>
          </button>
          <button id="close-actions" class="node-icon" aria-label="Close node actions" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <form id="attribute-form" hidden>
          <h2 id="attribute-heading">Add attribute</h2>
          <label for="attribute-name">Name <input id="attribute-name" name="name" required autocomplete="off" spellcheck="false" placeholder="e.g. Email"></label>
          <label for="attribute-label">Label <span class="optional">(optional)</span><input id="attribute-label" name="label" autocomplete="off" placeholder="Display text"></label>
          <div class="attribute-flags"><label><input id="attribute-multivalued" type="checkbox"> Multivalued</label><label><input id="attribute-derived" type="checkbox"> Derived</label></div>
          <p id="attribute-message" role="status" aria-live="polite"></p>
          <div class="form-controls"><button id="attribute-save" type="submit">Save attribute</button><button id="attribute-rebase" type="button" hidden>Use current model</button><button id="attribute-cancel" type="button">Cancel</button></div>
        </form>
      </div>
      <p id="placeholder">Loading the model…</p>
      <div class="zoom-controls"><button id="minus" aria-label="Zoom out">−</button><output id="zoom">100%</output><button id="plus" aria-label="Zoom in">+</button><button id="actual" title="100% (0)">100%</button></div>
    </section>
    <aside id="notes" class="notes" aria-label="Model findings">
      <button id="drawer" class="drawer" aria-label="Resize notes drawer. Arrow keys change its height.">Findings</button>
      <div id="findings" class="findings"><p>Waiting for findings…</p></div>
    </aside>
  </main>
  <script type="module" src="./main.ts"></script>
</body></html>
